<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a3f8f">
<title>Anupam AI</title>
<style>
  :root {
    --bg: #f6f5fa; --fg: #1c1b22; --muted: #6f6a85; --accent: #4a3f8f;
    --accent-fg: #fff; --card-bg: #fff; --border: #e2dfec; --field-border: #c8c4d8;
    --picker-border: #b3aecb; --picker-bg: #fff; --err: #b3261e; --track: #b3aecb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16141e; --fg: #f1eefa; --muted: #a39dbe; --accent: #9587ff;
      --accent-fg: #16141e; --card-bg: #221f2d; --border: #332f43;
      --field-border: #3c3752; --picker-border: #4c4666; --picker-bg: #221f2d;
      --err: #ff8078; --track: #4c4666;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px 16px 40px;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 21px; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .tagline { margin: 0 0 20px; font-size: 13.5px; color: var(--muted); }
  label.field { display: block; margin: 20px 0 8px; font-size: 14px; font-weight: 600; }
  .sub { font-weight: 400; color: var(--muted); font-size: 13px; }

  .picker {
    border: 2px dashed var(--picker-border); border-radius: 12px; background: var(--picker-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; color: var(--muted); text-align: center; font-size: 13px;
    padding: 6px; overflow: hidden; position: relative; cursor: pointer;
  }
  .picker.filled { border-style: solid; border-color: var(--accent); }
  .picker .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .picker .empty svg { opacity: .6; }
  .picker img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .picker .x {
    position: absolute; top: 6px; right: 6px; z-index: 3;
    width: 28px; height: 28px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.6); color: #fff; font-size: 17px; line-height: 1;
    display: none; align-items: center; justify-content: center; padding: 0;
  }
  .picker.filled .x { display: flex; }

  #customer { width: 46%; aspect-ratio: 3/4; }
  .garments { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .garments .picker { aspect-ratio: 3/4; }

  select, input[type=password] {
    width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--field-border);
    border-radius: 10px; background: var(--card-bg); color: var(--fg);
  }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 12px; font-size: 15px; border: 1px solid var(--field-border);
    background: var(--card-bg); border-radius: 10px; color: var(--fg);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  #go {
    width: 100%; margin-top: 22px; padding: 16px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg);
  }
  #go:disabled { background: var(--track); color: var(--bg); }
  #status { margin-top: 14px; text-align: center; color: var(--muted); min-height: 22px; }
  #status.err { color: var(--err); }

  .card {
    margin-top: 16px; background: var(--card-bg); border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); animation: rise .25s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card .head {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600;
  }
  .card .head img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
  .card .body { padding: 10px; }
  .card .body img { width: 100%; border-radius: 8px; display: block; }
  .card .body.pending, .card .body.failed {
    padding: 26px 12px; text-align: center; color: var(--muted); font-size: 14px;
  }
  .card .body.failed { color: var(--err); }
  .card .note {
    margin: 8px 10px 12px; padding: 9px 11px; font-size: 12.5px; color: var(--muted);
    text-align: center; border-radius: 8px; background: var(--bg);
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(15,13,23,.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 30;
  }
  .sheet-backdrop[hidden] { display: none; }
  .sheet-card {
    width: 100%; max-width: 560px; background: var(--card-bg);
    border-radius: 16px 16px 0 0; padding: 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .sheet-card button {
    display: block; width: 100%; padding: 15px; font-size: 16px; text-align: center;
    background: none; border: 0; border-radius: 10px; color: var(--fg);
  }
  .sheet-card button:active { background: var(--bg); }
  .sheet-card .sheet-cancel {
    margin-top: 6px; font-weight: 600; color: var(--muted);
    border-top: 1px solid var(--border); border-radius: 0; padding-top: 16px;
  }
</style>
</head>
<body>

<h1>Anupam AI</h1>
<p class="tagline">Photo in, styled try-on out — usually ready in 20–30 seconds.</p>

<label class="field">Customer photo</label>
<div id="customerSlot"></div>

<label class="field">Garments <span class="sub">— up to 2, compared side by side</span></label>
<div class="garments" id="garments"></div>
<p class="hint">Photograph garments flat on a plain surface. Screenshots from shopping apps give worse results.</p>

<label class="field">Customer</label>
<div class="seg" id="gender">
  <button type="button" data-v="female" aria-pressed="true">Female</button>
  <button type="button" data-v="male" aria-pressed="false">Male</button>
</div>

<label class="field">Look <span class="sub">— makeup styled to the outfit</span></label>
<div class="seg" id="makeup">
  <button type="button" data-v="1" aria-pressed="true">Makeup</button>
  <button type="button" data-v="0" aria-pressed="false">Natural</button>
</div>

<label class="field" for="category">Garment type <span class="sub">— applies to both</span></label>
<select id="category">
  <optgroup label="Indian — Women">
    <option>Saree</option><option>Salwar Suit</option><option>Kurti</option>
    <option>Anarkali</option><option>Lehenga</option><option>Churidar</option>
    <option>Palazzo Suit</option><option>Blouse</option>
  </optgroup>
  <optgroup label="Indian — Men">
    <option>Kurta</option><option>Kurta Pyjama</option><option>Sherwani</option>
    <option>Nehru Jacket</option><option>Dhoti</option>
  </optgroup>
  <optgroup label="Tops">
    <option>Shirt</option><option>T-Shirt</option><option>Top</option><option>Vest</option>
    <option>Hoodie</option><option>Sweater</option><option>Jacket</option><option>Blazer</option>
  </optgroup>
  <optgroup label="Bottoms">
    <option>Trousers</option><option>Jeans</option><option>Cargo Pants</option>
    <option>Track Pants</option><option>Shorts</option><option>Skirt</option>
    <option>Palazzo</option><option>Leggings</option>
  </optgroup>
  <optgroup label="Full outfit">
    <option>Suit</option><option>Dress</option><option>Gown</option>
    <option>Jumpsuit</option><option>Co-ord Set</option>
  </optgroup>
</select>

<label class="field" for="pin">Shop PIN</label>
<input type="password" id="pin" inputmode="numeric" placeholder="Entered once, then remembered">

<button id="go" disabled>Generate</button>
<div id="status"></div>
<div id="results"></div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet-card">
    <button type="button" data-a="camera">Take photo</button>
    <button type="button" data-a="gallery">Choose from gallery</button>
    <button type="button" class="sheet-cancel" data-a="cancel">Cancel</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const SLOTS = 2;
let customerFile = null;
const garmentFiles = new Array(SLOTS).fill(null);
let gender = "female";
let makeup = "1";   // Makeup by default

$("#pin").value = localStorage.getItem("shopPin") || "";

/* ---------- pickers ---------- */

const CAMERA_ICON =
  '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
  'stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/>' +
  '<circle cx="12" cy="13.3" r="3.4"/></svg>';

function buildPickerBox(label) {
  const box = document.createElement("div");
  box.className = "picker";
  box.innerHTML =
    '<div class="empty">' + CAMERA_ICON + '<span>' + label + '</span></div>' +
    '<button class="x" type="button" aria-label="Remove">&times;</button>';
  return box;
}

// Two hidden inputs per picker rather than one: `capture` reliably opens the camera
// directly on Android (without it, Android's file chooser often buries the camera
// behind a "Files" app rather than offering it up front, unlike iOS Safari which
// always surfaces "Take Photo" in its action sheet). Splitting it into an explicit
// Camera/Gallery choice makes both platforms behave the same way.
function makePicker(box, onPick, onClear) {
  const camInput = document.createElement("input");
  camInput.type = "file"; camInput.accept = "image/*";
  camInput.setAttribute("capture", "environment");
  const galInput = document.createElement("input");
  galInput.type = "file"; galInput.accept = "image/*";
  camInput.hidden = galInput.hidden = true;
  box.append(camInput, galInput);

  function handleFile(f) {
    if (!f) return;
    onPick(f);
    box.querySelector("img")?.remove();
    const img = document.createElement("img");
    img.src = URL.createObjectURL(f);
    box.prepend(img);
    box.classList.add("filled");
    refresh();
  }
  camInput.addEventListener("change", e => handleFile(e.target.files[0]));
  galInput.addEventListener("change", e => handleFile(e.target.files[0]));

  box.addEventListener("click", e => {
    if (e.target.closest(".x")) return;
    openSheet(camInput, galInput);
  });

  box.querySelector(".x").addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();      // must not fall through and reopen the sheet
    onClear();
    box.querySelector("img")?.remove();
    box.classList.remove("filled");
    camInput.value = "";
    galInput.value = "";      // so picking the same file again still fires change
    refresh();
  });
}

const customerBox = buildPickerBox("Customer photo");
customerBox.id = "customer";
$("#customerSlot").appendChild(customerBox);
makePicker(customerBox, f => customerFile = f, () => customerFile = null);

const garmentsEl = $("#garments");
for (let i = 0; i < SLOTS; i++) {
  const box = buildPickerBox("Add garment");
  garmentsEl.appendChild(box);
  makePicker(box, f => garmentFiles[i] = f, () => garmentFiles[i] = null);
}

function chosenGarments() {
  return garmentFiles.map((f, i) => ({ f, i })).filter(g => g.f);
}
function refresh() {
  $("#go").disabled = !(customerFile && chosenGarments().length);
}

/* ---------- camera / gallery sheet ---------- */

const sheet = $("#sheet");
let pendingInputs = null;

function openSheet(camInput, galInput) {
  pendingInputs = { camInput, galInput };
  sheet.hidden = false;
}
function closeSheet() {
  sheet.hidden = true;
  pendingInputs = null;
}
sheet.addEventListener("click", e => {
  if (e.target === sheet) return closeSheet();   // backdrop tap
  const btn = e.target.closest("button");
  if (!btn || !pendingInputs) return;
  const { camInput, galInput } = pendingInputs;
  if (btn.dataset.a === "camera") camInput.click();
  else if (btn.dataset.a === "gallery") galInput.click();
  closeSheet();
});

function wireSegment(id, onPick) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    onPick(b.dataset.v);
    [...$(id).children].forEach(x => x.setAttribute("aria-pressed", x === b));
  });
}
wireSegment("#gender", v => gender = v);
wireSegment("#makeup", v => makeup = v);

/* ---------- generation ---------- */

$("#go").addEventListener("click", async () => {
  const pin = $("#pin").value.trim();
  if (!pin) { setStatus("Enter the shop PIN", true); return; }
  localStorage.setItem("shopPin", pin);

  const garments = chosenGarments();
  const category = $("#category").value.toLowerCase().replace(/\s+/g, "_");

  $("#go").disabled = true;
  $("#results").innerHTML = "";
  setStatus(`Generating ${garments.length} look${garments.length > 1 ? "s" : ""}… 10–30 seconds`);

  // One card per garment up front, filled in as each request lands, so the first
  // result is visible without waiting for the slowest one.
  const bodies = garments.map(g => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="head"><img src="' + URL.createObjectURL(g.f) + '">' +
      "<span>Garment " + (g.i + 1) + "</span></div>" +
      '<div class="body pending">Generating…</div>';
    $("#results").appendChild(card);
    return card.querySelector(".body");
  });

  let failures = 0;
  await Promise.all(garments.map(async (g, n) => {
    const fd = new FormData();
    fd.append("customer_image", customerFile);
    fd.append("garment_image", g.f);
    fd.append("gender", gender);
    fd.append("category", category);
    fd.append("makeup", makeup);
    try {
      const res = await fetch("generate", {
        method: "POST", body: fd, headers: { "X-Shop-Pin": pin },
      });
      if (res.status === 401) throw new Error("Wrong shop PIN");
      if (res.status === 429) throw new Error("Busy — wait a few seconds and tap Generate again");
      if (!res.ok) {
        // The backend sends a readable reason (e.g. a safety decline) as JSON detail.
        let msg = "Server error " + res.status;
        try { msg = (await res.json()).detail || msg; } catch (_) {}
        throw new Error(msg);
      }
      const url = URL.createObjectURL(await res.blob());
      bodies[n].className = "body";
      bodies[n].innerHTML = '<img src="' + url + '">';
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "Not saved to this device — only shown here.";
      bodies[n].after(note);
    } catch (err) {
      failures++;
      bodies[n].className = "body failed";
      bodies[n].textContent = err.message;
    }
  }));

  setStatus(failures ? `${failures} of ${garments.length} failed — tap Generate to retry` : "", !!failures);
  $("#go").disabled = false;
});

function setStatus(msg, isErr) {
  const el = $("#status");
  el.textContent = msg;
  el.className = isErr ? "err" : "";
}
</script>
</body>
</html>
